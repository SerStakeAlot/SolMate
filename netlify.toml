[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20.19.4"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # XSS Protection
    X-XSS-Protection = "1; mode=block"
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS - Force HTTPS (1 year)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Permissions Policy - Disable unnecessary features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy - Updated for Privy wallet auth + MWA localhost websocket
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* https://solmate-production.up.railway.app wss://solmate-production.up.railway.app https://mainnet.helius-rpc.com wss://mainnet.helius-rpc.com https://*.solana.com wss://*.solana.com https://pump.fun https://*.privy.io wss://*.privy.io https://auth.privy.io https://*.walletconnect.com wss://*.walletconnect.com https://explorer-api.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.org https://relay.walletconnect.com wss://relay.walletconnect.com https://rpc.walletconnect.com; frame-src 'self' https://*.privy.io; frame-ancestors 'none';"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Digital Asset Links for TWA
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/SolMate.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=SolMate.apk"

